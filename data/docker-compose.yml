version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/app.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://ollama:11434}
      - USE_LOCAL_LLM=${USE_LOCAL_LLM:-true}
      - SECRET_KEY=${SECRET_KEY:-change-me}
    networks:
      - autoapply-network

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
    networks:
      - autoapply-network

  # Optional local LLM service (Ollama) - uncomment to use
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./ollama:/root/.ollama
  #   networks:
  #     - autoapply-network
  #   command: serve

networks:
  autoapply-network:
    driver: bridge